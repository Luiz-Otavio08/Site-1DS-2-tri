<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu blog</title>
    <style>
        header {
            text-align: center;
            background-color: rgb(151, 236, 157);
            color: white;
            max-width: 800px;
            margin: 0 auto;
            padding: 5px;
        }

        main {
            background-color: rgb(117, 240, 126);
            color: white;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 5px; 
            display: flex;
        }
        img {
            width: 100px;
            height: 100px;

        }

        .artigo-autor{
            font-weight: bold ;

        }
    </style>
</head>
<body>

    <header>
        <h1>CURSO DE COMO VENDER CURSO</h1>
        <p>Venha e me de seu dinheiro</p>
    </header>

    <main>
        <img src="imagem_blog.png" alt="Homem vestindo um terno azul-marinho de três peças com gravata estampada, apresentando-se em um palco de palestra para uma plateia. Ele usa uma máscara ornamental estilo baile de máscaras dourada e preta sobre os olhos, contendo a palavra MENTIROSO escrita em destaque. Ao fundo, uma tela grande exibe o texto CURSO DE VENDAS DE CURSOS e SEJA UM MENTIROSO... OU VENDA BEM?.">
        <div class="artigo-autor">
        <h2>meu primeiro blog</h2>
        <p>seja bem vindo</p>
        <p class="artigo-autor">Por Luiz</p>
        <button>🛑<span>0</span></button>
        </div>
</main>
    

</body>
<script>
const botao = document.querySelector("button");
botao.addEventListener("click", botaoClicado);
function botaoClicado() {
console.log("fui clicado");
let texto = botao.querySelector("span");
texto.textContent++;
}

</script>

</html>
